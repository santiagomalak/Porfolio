<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#04211d"/>
      <stop offset="100%" stop-color="#081412"/>
    </linearGradient>
    <filter id="blur-lg"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur-md"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blur-sm"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Watermarks — blurred background -->
  <g filter="url(#blur-lg)" opacity="0.18">
    <text x="420" y="180" font-family="monospace" font-size="120" fill="#0d9488" text-anchor="middle">CMJ</text>
  </g>
  <g filter="url(#blur-md)" opacity="0.13">
    <text x="660" y="330" font-family="monospace" font-size="70" fill="#2dd4bf" text-anchor="middle">IMTP</text>
  </g>
  <g filter="url(#blur-md)" opacity="0.10">
    <text x="140" y="380" font-family="monospace" font-size="60" fill="#0d9488" text-anchor="middle">numpy</text>
  </g>
  <g filter="url(#blur-sm)" opacity="0.12">
    <text x="600" y="100" font-family="monospace" font-size="48" fill="#2dd4bf" text-anchor="middle">Faker</text>
  </g>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#0d9488" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Accent line -->
  <rect x="60" y="100" width="3" height="160" rx="2" fill="#0d9488" opacity="0.8"/>

  <!-- Main content -->
  <text x="80" y="135" font-family="monospace" font-size="11" fill="#2dd4bf" opacity="0.8" letter-spacing="3">SPORT SCIENCE · CMJ / IMTP · PRIVACY-FIRST</text>
  <text x="80" y="200" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#ffffff">Athlete Performance</text>
  <text x="80" y="258" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#2dd4bf">Monitor</text>
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="14" fill="#7fa89f">6.500+ mediciones · numpy · Faker · window functions</text>
</svg>
